name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ARTEFACTS: build/OpenSmacker_artefacts/Release

jobs:
  macos:
    if: false
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Sign ad hoc
        run: |
          codesign --force --deep --sign - "$ARTEFACTS/VST3/openSmacker.vst3"
          codesign --force --deep --sign - "$ARTEFACTS/AU/openSmacker.component"
          codesign --force --deep --sign - "$ARTEFACTS/Standalone/openSmacker.app"

      - name: Validate with pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate "$ARTEFACTS/VST3/openSmacker.vst3"

      - name: Package
        run: |
          mkdir -p dist
          ditto "$ARTEFACTS/VST3/openSmacker.vst3" "dist/openSmacker.vst3"
          ditto "$ARTEFACTS/AU/openSmacker.component" "dist/openSmacker.component"
          ditto "$ARTEFACTS/LV2/openSmacker.lv2" "dist/openSmacker.lv2"
          ditto "$ARTEFACTS/Standalone/openSmacker.app" "dist/openSmacker.app"
          python3 scripts/package_notices.py dist
          ditto -c -k dist openSmacker-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: openSmacker-macOS
          path: openSmacker-macOS.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Validate with pluginval
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 5 --validate "$env:ARTEFACTS/VST3/openSmacker.vst3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item -Recurse "$env:ARTEFACTS/VST3/openSmacker.vst3" dist/
          Copy-Item -Recurse "$env:ARTEFACTS/LV2/openSmacker.lv2" dist/
          Copy-Item "$env:ARTEFACTS/Standalone/openSmacker.exe" dist/
          python scripts/package_notices.py dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist/* -DestinationPath openSmacker-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: openSmacker-Windows
          path: openSmacker-Windows.zip

  linux:
    if: false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf > /dev/null
          echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4
          sudo grep -rl "azure.archive.ubuntu.com" /etc/apt/ 2>/dev/null | xargs -r sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g'
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libglu1-mesa-dev mesa-common-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          mkdir -p dist
          cp -r "$ARTEFACTS/VST3/openSmacker.vst3" "$ARTEFACTS/LV2/openSmacker.lv2" dist/
          cp "$ARTEFACTS/Standalone/openSmacker" dist/
          python3 scripts/package_notices.py dist
          (cd dist && zip -qr ../openSmacker-Linux.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: openSmacker-Linux
          path: openSmacker-Linux.zip

  release:
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && needs.windows.result == 'success' && (needs.macos.result == 'skipped' || needs.macos.result == 'success') && (needs.linux.result == 'skipped' || needs.linux.result == 'success') }}
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Write release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
        run: python3 scripts/release_body.py --tag "$RELEASE_TAG" --repo "$RELEASE_REPO" --output release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          files: openSmacker-*.zip
          body_path: release-notes.md

  # The macOS and Linux package jobs stay disabled. This job is what refreshes
  # docs/screenshots/preview.png. Nothing else on a main push renders the editor.
  update-preview:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Skip when the editor sources did not change
        id: scope
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$before" "${{ github.sha }}" > /tmp/changed-files
          if grep -qE '^(Source/|Tests/|assets/|CMakeLists\.txt$)' /tmp/changed-files; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No editor sources in this push."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: |
          set -euo pipefail
          echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf > /dev/null
          echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4
          sudo grep -rl "azure.archive.ubuntu.com" /etc/apt/ 2>/dev/null | xargs -r sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g'
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libglu1-mesa-dev mesa-common-dev \
            xvfb xauth fonts-dejavu-core

      - name: Configure
        if: steps.scope.outputs.run == 'true'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build editor tests
        if: steps.scope.outputs.run == 'true'
        run: cmake --build build --config Release --parallel --target opensmacker_plugin_tests

      - name: Capture the factory editor
        if: steps.scope.outputs.run == 'true'
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1400x900x24" ./build/opensmacker_plugin_tests '[plugin][gui]'
          cp assets/openSmacker-hit.png docs/screenshots/preview.png
          git checkout -- assets

      - name: Commit refreshed preview
        if: steps.scope.outputs.run == 'true'
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/screenshots/preview.png; then
            echo "Preview unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/preview.png
          git commit -m "docs: refresh preview screenshot [skip ci]"
          git push origin HEAD:main || {
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          }
